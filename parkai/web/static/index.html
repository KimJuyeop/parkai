<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>parkai 설정</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <strong>parkai</strong>
      <span id="siteLabel" class="muted"></span>
    </div>
    <nav class="tabs">
      <button data-tab="dashboard" class="active">대시보드</button>
      <button data-tab="camera">카메라 설정</button>
      <button data-tab="settings">시스템 설정</button>
    </nav>
    <div id="sysLabel" class="muted small"></div>
  </header>

  <main>
    <!-- 대시보드 -->
    <section id="tab-dashboard" class="tab active">
      <div class="metrics" id="metrics"></div>
      <div class="grid" id="camCards"></div>
    </section>

    <!-- 카메라 설정 -->
    <section id="tab-camera" class="tab">
      <div class="cam-layout">
        <aside class="cam-list">
          <div class="add-cam">
            <input id="newCamIp" placeholder="192.168.0.10">
            <button id="addCamBtn">추가</button>
          </div>
          <ul id="camList"></ul>
        </aside>
        <div class="cam-editor" id="camEditor">
          <p class="muted">왼쪽에서 카메라를 선택하거나 IP를 입력해 추가하세요.</p>
        </div>
      </div>
    </section>

    <!-- 시스템 설정 -->
    <section id="tab-settings" class="tab">
      <div id="settingsForm"></div>
    </section>
  </main>

  <div class="savebar hidden" id="saveBar">
    <span>저장하지 않은 변경 사항이 있습니다</span>
    <span id="saveErrors" class="error"></span>
    <button id="revertBtn">되돌리기</button>
    <button id="saveBtn" class="primary">저장</button>
  </div>
  <div class="toast hidden" id="toast"></div>

  <script src="app.js"></script>
</body>
</html>
