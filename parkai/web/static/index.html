<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>parkai 설정</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <strong>parkai</strong>
      <span id="siteLabel" class="muted"></span>
    </div>
    <nav class="tabs">
      <button data-tab="dashboard" class="active">대시보드</button>
      <button data-tab="camera">카메라 설정</button>
      <button data-tab="settings">시스템 설정</button>
    </nav>
    <div id="sysLabel" class="muted small"></div>
  </header>

  <main>
    <!-- 대시보드 -->
    <section id="tab-dashboard" class="tab active">
      <div class="metrics" id="metrics"></div>
      <div class="notice hidden" id="dashNotice">
        워커가 실행 중이 아니어서 판정 결과 대신 카메라 스냅샷을 보여줍니다.
        PC에서는 <code>python tools/dev.py</code>로 웹과 워커를 함께 실행하세요.
      </div>
      <div class="legend">
        <span><i style="background:#16a34a"></i>차량 있음</span>
        <span><i style="background:#dc2626"></i>빈칸</span>
        <span><i style="background:#9ca3af"></i>판정 없음</span>
      </div>
      <div class="grid" id="camCards"></div>
    </section>

    <!-- 카메라 설정 -->
    <section id="tab-camera" class="tab">
      <div class="cam-layout">
        <aside class="cam-list">
          <div class="add-cam">
            <input id="newCamIp" placeholder="192.168.0.10">
            <button id="addCamBtn">추가</button>
          </div>
          <ul id="camList"></ul>
        </aside>
        <div class="cam-editor" id="camEditor">
          <p class="muted">왼쪽에서 카메라를 선택하거나 IP를 입력해 추가하세요.</p>
        </div>
      </div>
    </section>

    <!-- 시스템 설정 -->
    <section id="tab-settings" class="tab">
      <div id="settingsForm"></div>
    </section>
  </main>

  <div class="savebar hidden" id="saveBar">
    <span>저장하지 않은 변경 사항이 있습니다</span>
    <span id="saveErrors" class="error"></span>
    <button id="revertBtn">되돌리기</button>
    <button id="saveBtn" class="primary">저장</button>
  </div>
  <div class="toast hidden" id="toast"></div>

  <div class="modal hidden" id="modal" onclick="if (event.target === this) closeModal()">
    <div class="modal-box">
      <div class="modal-head">
        <strong id="modalTitle"></strong>
        <span id="modalStatus" class="badge"></span>
        <span class="spacer"></span>
        <button onclick="closeModal()">닫기 (Esc)</button>
      </div>
      <img id="modalImg" class="modal-img" alt="">
      <div class="modal-foot">
        <div id="modalInfo" class="muted small"></div>
        <table><tbody id="modalSlots"></tbody></table>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
