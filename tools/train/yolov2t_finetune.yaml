# yolov2t (ST 사전학습 COCO 사람, 416 → 480 으로 바꾼 것) 을 현장 차량 1클래스로 추가 학습 + 양자화 + 평가
# st_yoloxn 은 depthwise 층이 많아 NPU 용 per-tensor 양자화에서 정확도가 무너진다 (docs/training.md 7절).
# yolov2t 는 일반 합성곱만 써서 per-tensor 에 강하고 MP257 NPU 에서 돈다 (ST 측정 416: 14.6ms, NPU 96%).
# 라이선스: ST SLA0044 (ST 제품에서 사용).
# 사전학습 모델 준비 (한 번): 아래 '모델' 절 주석 참고
# ST Model Zoo services 에서 두 번 나눠 실행한다 (docs/training.md 5번):
#   1) 학습:        python stm32ai_main.py --config-path <폴더> --config-name st_yoloxn_finetune
#   2) 평가+양자화: ... operation_mode=chain_eqe model.model_path=<1번 결과>/saved_models/best_model.keras
# chain_tqe 한 번으로 하지 않는 이유: Model Zoo(a07f68a)는 학습과 평가를 한 번에 돌리면
# darknet_yolo 형식의 시험(test) 세트를 변환하지 않아 'test_path None' 오류로 멈춘다.
# 경로(<...>)는 실제 위치로 바꾼다. WSL에서 윈도우 폴더는 /mnt/c/... 로 보인다.

general:
  project_name: parkai_yolov2t_480_car
  logs_dir: logs
  saved_models_dir: saved_models
  display_figures: false
  gpu_memory_limit: 7          # RTX 4070 Laptop 8GB
  global_seed: 123

model:
  model_type: yolov2t
  # Model Zoo 는 입력 크기를 모델 파일에서 읽는다. 사전학습은 416 뿐이라 480 으로 바꿔 둔다:
  #   curl -fL -o yolov2t_416.keras https://raw.githubusercontent.com/STMicroelectronics/stm32ai-modelzoo/1423c78953a830903485135febe1dd98ff31aed8/object_detection/yolov2t/ST_pretrainedmodel_public_dataset/coco_2017_person/yolov2t_416/yolov2t_416.keras
  #   sha256 e003c53616562d0e722e96cc4a6433d31a3a53ad92bd439e4429bfc0a78f4344
  #   python <parkai>/tools/train/resize_keras_input.py yolov2t_416.keras yolov2t_480.keras 480
  model_path: <HOME>/st_train/pretrained/yolov2t_480.keras   # 출발점 (머리만 1클래스로 바뀜)

operation_mode: training        # 2단계에서 chain_eqe (평가 → TFLite 양자화 → 평가)

dataset:
  format: darknet_yolo
  dataset_name: darknet_yolo
  class_names: [car]
  exclude_unlabeled: false      # 빈 주차장 사진도 학습 (차 없는 장면을 차로 착각하지 않게)
  max_detections: 50
  train_images_path: <SPLIT>/train
  train_annotations_path: <SPLIT>/train
  val_images_path: <SPLIT>/val
  val_annotations_path: <SPLIT>/val
  test_images_path: <SPLIT>/test
  test_annotations_path: <SPLIT>/test
  quantization_path: <SPLIT>/train
  quantization_split: 0.05

# 보드 parkai 의 models/st_yoloxn_*/model.json 과 반드시 같게 (1/255, fit, nearest, rgb)
preprocessing:
  rescaling:
    scale: 1/255
    offset: 0
  resizing:
    aspect_ratio: fit
    interpolation: nearest
  color_mode: rgb

data_augmentation:
  random_crop:
    crop_center_x: (0.25, 0.75)
    crop_center_y: (0.25, 0.75)
    crop_width: (0.6, 0.9)
    crop_height: (0.6, 0.9)
    change_rate: 0.5
  random_periodic_resizing:
    period: 20
    image_sizes:
    - (416, 416)
    - (448, 448)
    - (480, 480)
    - (512, 512)
    - (544, 544)
  random_contrast:
    factor: 0.4
  random_brightness:
    factor: 0.3
  random_flip:
    mode: horizontal
  random_rotation:
    factor: 0.02
    fill_mode: reflect
    interpolation: nearest

training:
  dropout: null
  batch_size: 16                # 8GB GPU 기준. 메모리 부족이면 8
  epochs: 300                   # 첫 학습(150회)은 마지막 회차가 최고점이라 덜 끝났었다
  optimizer:
    Adam:
      learning_rate: 0.001
  callbacks:
    LRWarmupCosineDecay:
      initial_lr: 1.0e-05
      warmup_steps: 5
      max_lr: 0.001             # 머리는 새로 학습 (ST 원래 0.00125, 배치 64)
      hold_steps: 10
      decay_steps: 285
      end_lr: 1.0e-06
    EarlyStopping:
      monitor: val_loss
      patience: 60
      restore_best_weights: true
      verbose: 1

postprocessing:
  # 현장 차량 박스(정규화 w,h) k-means 5개를 격자 단위(x15)로. 머리는 새로 만들어지므로 사전학습 앵커와 달라도 된다.
  # Model Zoo 기본 앵커(사람용, 격자 단위로 쓰면 박스의 1/15 크기)는 차량 박스와 평균 IoU 0.07 이라
  # 첫 학습(150회)에서 납작한 박스가 많이 나왔다. 이 앵커는 평균 IoU 0.82. parkai model.json 과 같아야 한다
  yolo_anchors: [1.5469, 1.6458, 2.2734, 2.7917, 3.0352, 3.5417, 2.6016, 4.7292, 4.2012, 6.5729]
  confidence_thresh: 0.001
  NMS_thresh: 0.5
  IoU_eval_thresh: 0.5
  plot_metrics: true
  max_detection_boxes: 100

# 보드 NPU 용: TFLite per-tensor int8 (입력 uint8, 출력 float) → ST Edge AI Core 2.2 로 .nb
quantization:
  quantizer: TFlite_converter
  quantization_type: PTQ
  granularity: per_tensor
  quantization_input_type: uint8
  quantization_output_type: float
  export_dir: quantized_models

mlflow:
  uri: ./tf/src/experiments_outputs/mlruns

hydra:
  run:
    dir: ./tf/src/experiments_outputs/${now:%Y_%m_%d_%H_%M_%S}
