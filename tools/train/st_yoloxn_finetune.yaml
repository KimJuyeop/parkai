# st_yoloxn (ST 사전학습 COCO 80, 480) 을 현장 차량 1클래스로 추가 학습 + 양자화 + 평가
# ST Model Zoo services 에서 두 번 나눠 실행한다 (docs/training.md 5번):
#   1) 학습:        python stm32ai_main.py --config-path <폴더> --config-name st_yoloxn_finetune
#   2) 평가+양자화: ... operation_mode=chain_eqe model.model_path=<1번 결과>/saved_models/best_model.keras
# chain_tqe 한 번으로 하지 않는 이유: Model Zoo(a07f68a)는 학습과 평가를 한 번에 돌리면
# darknet_yolo 형식의 시험(test) 세트를 변환하지 않아 'test_path None' 오류로 멈춘다.
# 경로(<...>)는 실제 위치로 바꾼다. WSL에서 윈도우 폴더는 /mnt/c/... 로 보인다.

general:
  project_name: parkai_st_yoloxn_480_car
  logs_dir: logs
  saved_models_dir: saved_models
  display_figures: false
  gpu_memory_limit: 7          # RTX 4070 Laptop 8GB
  global_seed: 123

model:
  model_type: st_yoloxn
  model_path: <HOME>/st_train/pretrained/st_yoloxn_d100_w025_480.keras   # 출발점 (머리만 1클래스로 바뀜)

operation_mode: training        # 2단계에서 chain_eqe (평가 → TFLite 양자화 → 평가)

dataset:
  format: darknet_yolo
  dataset_name: darknet_yolo
  class_names: [car]
  exclude_unlabeled: false      # 빈 주차장 사진도 학습 (차 없는 장면을 차로 착각하지 않게)
  max_detections: 50
  train_images_path: <SPLIT>/train
  train_annotations_path: <SPLIT>/train
  val_images_path: <SPLIT>/val
  val_annotations_path: <SPLIT>/val
  test_images_path: <SPLIT>/test
  test_annotations_path: <SPLIT>/test
  quantization_path: <SPLIT>/train
  quantization_split: 0.05

# 보드 parkai 의 models/st_yoloxn_*/model.json 과 반드시 같게 (1/255, fit, nearest, rgb)
preprocessing:
  rescaling:
    scale: 1/255
    offset: 0
  resizing:
    aspect_ratio: fit
    interpolation: nearest
  color_mode: rgb

data_augmentation:
  random_crop:
    crop_center_x: (0.25, 0.75)
    crop_center_y: (0.25, 0.75)
    crop_width: (0.6, 0.9)
    crop_height: (0.6, 0.9)
    change_rate: 0.5
  random_periodic_resizing:
    period: 20
    image_sizes:
    - (416, 416)
    - (448, 448)
    - (480, 480)
    - (512, 512)
    - (544, 544)
  random_contrast:
    factor: 0.4
  random_brightness:
    factor: 0.3
  random_flip:
    mode: horizontal
  random_rotation:
    factor: 0.02
    fill_mode: reflect
    interpolation: nearest

training:
  dropout: null
  batch_size: 16                # 8GB GPU 기준. 메모리 부족이면 8
  epochs: 150
  optimizer:
    Adam:
      learning_rate: 0.001
  callbacks:
    LRWarmupCosineDecay:
      initial_lr: 1.0e-05
      warmup_steps: 5
      max_lr: 0.0005            # 처음부터가 아니라 이어서 학습이라 원래(0.00125)보다 낮게
      hold_steps: 10
      decay_steps: 135
      end_lr: 1.0e-06
    EarlyStopping:
      monitor: val_loss
      patience: 30
      restore_best_weights: true
      verbose: 1

postprocessing:
  yolo_anchors: [0.5, 0.5, 0.07, 0.25, 0.23, 0.7]   # 출발점 모델과 같게 (앵커 3개)
  confidence_thresh: 0.001
  NMS_thresh: 0.5
  IoU_eval_thresh: 0.5
  plot_metrics: true
  max_detection_boxes: 100

# 보드 NPU 용: TFLite per-tensor int8 (입력 uint8, 출력 float). 이것을 ST Edge AI Core 2.2 로 .nb 변환한다.
# - ONNX per-channel: .nb 로 바뀌지만 계산 94% 가 GPU 로 넘어가 118ms
# - ONNX per-tensor:  .nb 변환 실패 (E010 model is not supported)
# - TFLite per-tensor: 21.6ms, NPU 98.7%  ← 이것
# 정확도를 올리려면 +quantization.optimize=true (per-tensor 최적화). Model Zoo 버그는 setup_wsl.sh 가 고친다
quantization:
  quantizer: TFlite_converter
  quantization_type: PTQ
  granularity: per_tensor
  quantization_input_type: uint8
  quantization_output_type: float
  export_dir: quantized_models

mlflow:
  uri: ./tf/src/experiments_outputs/mlruns

hydra:
  run:
    dir: ./tf/src/experiments_outputs/${now:%Y_%m_%d_%H_%M_%S}
